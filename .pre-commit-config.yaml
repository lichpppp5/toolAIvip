repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=5120"]
        exclude: "^tests/fixtures/.*"
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: bash -c 'exec $(command -v mypy || echo .venv/bin/mypy) --strict liveguard/'
        language: system
        pass_filenames: false
        types: [python]

  - repo: local
    hooks:
      - id: no-eval
        name: Forbid eval() in Python source
        entry: 'eval\('
        language: pygrep
        types: [python]
        exclude: '^(tests/|\.venv/)'

      - id: no-hardcoded-secrets
        name: Forbid hardcoded OBS_WS_PASSWORD string literals
        entry: 'OBS_WS_PASSWORD\s*=\s*["''][^"'']+["'']'
        language: pygrep
        types: [python]
        exclude: '^(tests/|\.venv/)'
