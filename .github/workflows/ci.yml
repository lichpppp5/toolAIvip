name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dashboard,ml,dev]"

      - name: Ruff Check
        run: ruff check liveguard/ tests/

      - name: Black Check
        run: black --check liveguard/ tests/

      - name: Mypy Strict
        run: mypy --strict liveguard/

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dashboard,ml,dev]"

      - name: Run Unit Tests with Coverage
        run: pytest -v tests/unit/ --cov=liveguard --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  e2e:
    name: End-to-End Integration Tests
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (FFmpeg & ExifTool)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libexiftool-perl

      - name: Install dependencies
        run: pip install -e ".[dashboard,ml,dev]"

      - name: Run Integration Tests (Mock Model)
        env:
          LIVEGUARD_TEST_MOCK_MODEL: "1"
          CI_SKIP_GPU: "1"
        run: pytest -v tests/integration/test_e2e_pipeline.py

  security:
    name: Security & Policy Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit || true

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: sbom-liveguard.spdx.json

      - name: Guard - Forbid stream_key in M3
        run: |
          echo "Checking M3 code for forbidden stream_key strings..."
          if grep -ri "stream_key" node/m3 liveguard/modules/m3; then
            echo "ERROR: Forbidden stream_key scraping detected in M3!"
            exit 1
          fi

      - name: Guard - Forbid eval() in liveguard
        run: |
          echo "Checking for forbidden eval() calls in liveguard/..."
          if grep -rn "eval(" liveguard/; then
            echo "ERROR: Forbidden eval() found in liveguard/!"
            exit 1
          fi

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: liveguard:smoke
          load: true

      - name: Smoke Test Container Version
        run: docker run --rm liveguard:smoke --version
